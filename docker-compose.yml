services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest-alpine
    container_name: singbox-audit-clickhouse
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    environment:
      - CLICKHOUSE_DB=audit
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  audit-dashboard:
    image: ghcr.io/singbox-audit/dashboard:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: singbox-audit-dashboard
    restart: unless-stopped
    ports:
      - "8080:3000"
    depends_on:
      - clickhouse
    environment:
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_DB=audit
      - DATA_DIR=/app/data
      - GEOIP_DIR=/app/data/geoip
      - GEOIP_COUNTRY_URL=https://fastly.jsdelivr.net/gh/P3TERX/GeoLite.mmdb@download/GeoLite2-Country.mmdb
      - GEOIP_ASN_URL=https://fastly.jsdelivr.net/gh/P3TERX/GeoLite.mmdb@download/GeoLite2-ASN.mmdb
      - GEOIP_AUTO_UPDATE=true
      - GEOIP_UPDATE_INTERVAL_HOURS=24
      - TZ=UTC
    volumes:
      - ./data:/app/data
      - ~/.ssh:/root/.ssh:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
